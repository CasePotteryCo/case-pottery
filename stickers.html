<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Stickers</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; padding: 16px; color: #2b2420; background: #fff; }
    .controls { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .controls button { font: inherit; padding: 6px 14px; cursor: pointer; }
    .sheet { display: flex; flex-wrap: wrap; gap: 0.15in; }
    .sticker {
      width: var(--size); height: var(--size);
      border: 1px dashed #bbb; border-radius: 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0.06in; break-inside: avoid; text-align: center; overflow: hidden;
    }
    .sticker .logo { width: 46%; height: auto; display: block; margin-bottom: 2%; }
    .sticker svg { width: 62%; height: auto; display: block; }
    .sticker .label { font-size: calc(var(--size) * 0.075); line-height: 1.1; margin-top: 2%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    @media print {
      .controls { display: none; }
      body { padding: 0; }
      .sticker { border-color: #ddd; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>Sticker size
      <select id="size">
        <option value="1in">1 inch</option>
        <option value="1.5in" selected>1.5 inch</option>
        <option value="2in">2 inch</option>
      </select>
    </label>
    <label>Copies of each <input id="copies" type="number" min="1" max="30" value="1" style="width:4em"></label>
    <button onclick="window.print()">Print</button>
  </div>
  <div class="sheet" id="sheet"></div>

  <script src="pieces.js"></script>
  <script src="qrcode.js"></script>
  <script>
    // Print all pieces, or just one with stickers.html?id=blue-bowl
    function qrSvg(text) {
      const qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), quiet = 2, size = n + quiet * 2;
      let path = "";
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++)
          if (qr.isDark(r, c)) path += "M" + (c + quiet) + " " + (r + quiet) + "h1v1h-1z";
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + " " + size +
        '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + path + '" fill="#000"/></svg>';
    }

    function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

    function draw() {
      const only = new URLSearchParams(location.search).get("id");
      const list = only ? PIECES.filter(p => p.id === only) : PIECES;
      const copies = Math.max(1, Math.min(30, parseInt(document.getElementById("copies").value, 10) || 1));
      const base = SITE_URL.endsWith("/") ? SITE_URL : SITE_URL + "/";
      document.getElementById("sheet").style.setProperty("--size", document.getElementById("size").value);
      let html = "";
      for (const p of list) {
        const url = base + "piece.html?id=" + encodeURIComponent(p.id);
        const one = '<div class="sticker" title="' + esc(url) + '"><img class="logo" src="images/logo.png" alt="Case Pottery Co.">' + qrSvg(url) +
          '<div class="label">' + esc(p.name) + "</div></div>";
        html += one.repeat(copies);
      }
      document.getElementById("sheet").innerHTML = html || "<p>No pieces found.</p>";
    }

    document.getElementById("size").onchange = draw;
    document.getElementById("copies").oninput = draw;
    draw();
  </script>
</body>
</html>
